<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise RAG — Financial Document Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Financial Document Assistant</h1>
      <p class="subtitle">
        Ask questions over your documents — every answer is source-cited.
      </p>
      <span id="health" class="badge" aria-live="polite">checking…</span>
    </header>

    <main>
      <!-- Ingest -->
      <section class="card">
        <h2>1. Add a document</h2>
        <label for="source">Source name</label>
        <input id="source" type="text" placeholder="acme-10k-2024.pdf" />
        <label for="doc-text">Document text</label>
        <textarea
          id="doc-text"
          rows="6"
          placeholder="Paste document text here (e.g. an earnings summary)…"
        ></textarea>
        <button id="ingest-btn">Ingest document</button>
        <p id="ingest-status" class="status" role="status"></p>
      </section>

      <!-- Ask -->
      <section class="card">
        <h2>2. Ask a question</h2>
        <label for="question">Question</label>
        <input
          id="question"
          type="text"
          placeholder="What was Acme revenue in 2024?"
        />
        <div class="row">
          <label class="checkbox">
            <input id="agent-mode" type="checkbox" />
            Multi-step (agent) mode
          </label>
          <button id="ask-btn">Ask</button>
        </div>
        <p id="ask-status" class="status" role="status"></p>
      </section>

      <!-- Answer -->
      <section id="answer-card" class="card hidden" aria-live="polite">
        <h2>Answer</h2>
        <p id="answer-text" class="answer"></p>
        <div id="meta" class="meta"></div>
        <h3>Citations</h3>
        <ul id="citations"></ul>
      </section>
    </main>

    <footer>
      <a href="https://github.com/DoraChintala/enterprise-rag-agentic-pipeline"
        >GitHub</a
      >
      · RAG + Agentic pipeline · TypeScript
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
